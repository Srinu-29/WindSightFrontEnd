server {
    # Serve the compiled React files on the container's port 80.
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        # Compose resolves "backend" to the backend container. No trailing URI
        # on proxy_pass means /api/... is preserved when forwarded to FastAPI.
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location / {
        # Serve a matching file first; otherwise let React handle the page URL.
        try_files $uri $uri/ /index.html;
    }
}
